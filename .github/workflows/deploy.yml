name: Deploy UAT and Production

on:
  push:
    branches: [main, uat]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  configure-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

  build-production:
    environment: production
    needs: configure-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-src
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: production-src/package-lock.json
      - name: Install dependencies
        working-directory: production-src
        run: npm ci
      - name: Build production site
        working-directory: production-src
        run: npm run build:production
        env:
          VITE_APP_ENV: production
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: production-src/dist
          if-no-files-found: error

  build-uat:
    environment: uat
    needs: configure-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out UAT branch
        uses: actions/checkout@v4
        with:
          ref: uat
          path: uat-src
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uat-src/package-lock.json
      - name: Install dependencies
        working-directory: uat-src
        run: npm ci
      - name: Build UAT site
        working-directory: uat-src
        run: npm run build:uat
        env:
          VITE_APP_ENV: uat
          VITE_BASE_PATH: /${{ github.event.repository.name }}/uat/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Upload UAT build
        uses: actions/upload-artifact@v4
        with:
          name: uat-site
          path: uat-src/dist
          if-no-files-found: error

  combine-sites:
    needs: [build-production, build-uat]
    runs-on: ubuntu-latest
    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-site
          path: site
      - name: Download UAT build
        uses: actions/download-artifact@v4
        with:
          name: uat-site
          path: site/uat
      - name: Disable Jekyll processing
        run: touch site/.nojekyll
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: combine-sites
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy both environments
        id: deployment
        uses: actions/deploy-pages@v4
