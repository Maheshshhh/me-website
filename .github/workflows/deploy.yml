name: Deploy UAT and Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Site to publish
        type: choice
        options:
          - both
          - uat
        default: both
        required: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  configure-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

  build-production:
    if: github.event_name == 'push' || inputs.deploy_target == 'both'
    environment: production
    needs: configure-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-src
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: production-src/package-lock.json
      - name: Install dependencies
        working-directory: production-src
        run: npm ci
      - name: Build production site
        working-directory: production-src
        run: npm run build:production
        env:
          VITE_APP_ENV: production
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: production-src/dist
          retention-days: 90
          if-no-files-found: error

  build-uat:
    environment: uat
    needs: configure-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out UAT branch
        uses: actions/checkout@v4
        with:
          ref: uat
          path: uat-src
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uat-src/package-lock.json
      - name: Install dependencies
        working-directory: uat-src
        run: npm ci
      - name: Build UAT site
        working-directory: uat-src
        run: npm run build:uat
        env:
          VITE_APP_ENV: uat
          VITE_BASE_PATH: /${{ github.event.repository.name }}/uat/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Upload UAT build
        uses: actions/upload-artifact@v4
        with:
          name: uat-site
          path: uat-src/dist
          if-no-files-found: error

  combine-sites:
    needs: [build-production, build-uat]
    if: always() && needs.build-uat.result == 'success' && (needs.build-production.result == 'success' || needs.build-production.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Find latest production build
        id: find-production
        if: needs.build-production.result == 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy.yml",
              branch: "main",
              status: "success",
              per_page: 50,
            });

            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const productionArtifact = artifacts.data.artifacts.find(
                (artifact) => artifact.name === "production-site" && !artifact.expired,
              );
              if (productionArtifact) {
                core.setOutput("run_id", String(run.id));
                return;
              }
            }

            core.setFailed("No retained production-site artifact was found. Run a full deployment from main first.");

      - name: Download production build
        if: needs.build-production.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: production-site
          path: site
      - name: Download last production build
        if: needs.build-production.result == 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: production-site
          path: site
          run-id: ${{ steps.find-production.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download UAT build
        uses: actions/download-artifact@v4
        with:
          name: uat-site
          path: uat-site
      - name: Replace UAT site files
        run: |
          rm -rf site/uat
          mkdir -p site/uat
          cp -a uat-site/. site/uat/
      - name: Disable Jekyll processing
        run: touch site/.nojekyll
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: combine-sites
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
