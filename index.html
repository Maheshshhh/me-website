<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="Build a thoughtful professional profile that helps the right opportunities find you."
    />
    <title>Careerfolio — Your professional profile</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const route = new URLSearchParams(window.location.search).get("__route");
      if (route) {
        const base = "%BASE_URL%";
        const target = new URL(route, window.location.origin);
        const routePath = target.pathname.replace(/^\/+/, "");
        window.history.replaceState(null, "", `${base}${routePath}${target.search}${target.hash}`);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
